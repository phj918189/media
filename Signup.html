<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PRE Crossfit 회원가입 데모 페이지">
    <title>회원가입 | PRE Crossfit</title>
    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-shell">
            <a href="./index.html" class="auth-back"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> 메인으로 돌아가기</a>
            <section class="auth-card" id="signup">
                <span class="auth-brand">PRE CROSSFIT</span>
                <h1>회원가입</h1>
                <p>데모 UI로 제작된 회원가입 페이지입니다. 입력값은 브라우저에서만 확인됩니다.</p>
                <form class="auth-form" id="signupForm" onsubmit="return false;">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required>
                    <button type="button" onclick="submitSignup()">회원가입</button>
                </form>
                <div class="auth-links">
                    <a href="./Login.html">로그인</a>
                    <a href="./index.html">홈으로</a>
                </div>
                <div id="auth-message" class="auth-message" hidden></div>
            </section>
        </div>
    </main>
    <script src="./js/auth.js"></script>
</body>
</html>
