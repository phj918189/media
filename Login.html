<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PRE Crossfit 로그인 데모 페이지">
    <title>로그인 | PRE Crossfit</title>
    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-shell">
            <a href="./index.html" class="auth-back"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> 메인으로 돌아가기</a>
            <section class="auth-card" id="login">
                <span class="auth-brand">PRE CROSSFIT</span>
                <h1>로그인</h1>
                <p>포트폴리오 데모용 로그인 화면입니다. 실제 서버 인증은 연결되어 있지 않습니다.</p>
                <form class="auth-form" id="loginForm" onsubmit="return false;">
                    <label for="login-username">아이디</label>
                    <input type="text" id="login-username" name="login-username" autocomplete="username" required>
                    <label for="login-password">비밀번호</label>
                    <input type="password" id="login-password" name="login-password" autocomplete="current-password" required>
                    <button type="button" onclick="submitLogin()">로그인</button>
                </form>
                <div class="auth-links">
                    <a href="./Signup.html">회원가입</a>
                    <a href="./index.html">홈으로</a>
                </div>
                <div id="auth-message" class="auth-message" hidden></div>
            </section>
        </div>
    </main>
    <script src="./js/auth.js"></script>
</body>
</html>
